name: Ledger checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start development stack
        run: bash scripts/bootstrap.sh
      - name: Run checks
        run: bash scripts/check.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile test logs --no-color --tail=100
      - name: Stop disposable CI stack
        if: always()
        run: docker compose --profile test down --volumes
