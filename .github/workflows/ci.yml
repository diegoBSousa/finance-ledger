name: Ledger checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start development stack
        run: bash scripts/bootstrap.sh
      - name: Run checks
        run: bash scripts/check.sh
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: frontend/artifacts
          if-no-files-found: ignore
      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile test logs --no-color --tail=100
      - name: Stop disposable CI stack
        if: always()
        run: docker compose --profile test down --volumes
