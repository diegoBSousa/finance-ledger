; Decimal bytes: multipart overhead is allowed separately from the CSV limit.
upload_max_filesize=100000000
post_max_size=110000000
max_file_uploads=1
memory_limit=256M
max_execution_time=60
date.timezone=UTC
display_errors=Off
log_errors=On
opcache.enable=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
