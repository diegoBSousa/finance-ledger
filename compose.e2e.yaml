# Only scripts/test-e2e.sh starts this file. No development volumes or host ports.
x-e2e-php: &php
  image: finance-ledger-php:development
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  environment:
    APP_ENV: testing
    APP_DEBUG: "false"
    APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    APP_CONFIG_CACHE: /tmp/finance-ledger-e2e-config.php
    APP_ROUTES_CACHE: /tmp/finance-ledger-e2e-routes.php
    APP_URL: http://api:8080
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_SOCKET: ""
    DB_URL: ""
    DB_DATABASE: finance_ledger_e2e
    DB_USERNAME: ledger_e2e
    DB_PASSWORD: disposable-e2e-password
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_URL: ""
    REDIS_DB: 0
    REDIS_CACHE_DB: 1
    REDIS_PREFIX: "finance_ledger_e2e:"
    CACHE_STORE: redis
    CACHE_PREFIX: "finance_ledger_e2e_cache:"
    QUEUE_CONNECTION: redis
    REDIS_QUEUE_RETRY_AFTER: 90
    SESSION_DRIVER: array
    HASH_DRIVER: argon2id
    JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    JWT_ISSUER: finance-ledger-api
    JWT_AUDIENCE: finance-ledger-spa
    CORS_ALLOWED_ORIGINS: http://frontend:5173
    DEMO_USER_EMAIL: e2e@example.test
    DEMO_USER_PASSWORD: e2e-disposable-password-only
    IMPORT_UPLOAD_ROOT: /e2e-uploads
    LOG_CHANNEL: stderr
  volumes:
    - ./backend:/var/www/html:ro
    - ./scripts/e2e-prepare.sh:/e2e-prepare.sh:ro
    - e2e-storage:/var/www/html/storage
    - e2e-uploads:/e2e-uploads
  tmpfs:
    - /var/www/html/bootstrap/cache
  init: true

services:
  mysql:
    image: mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: finance_ledger_e2e
      MYSQL_USER: ledger_e2e
      MYSQL_PASSWORD: disposable-e2e-password
      MYSQL_ROOT_PASSWORD: disposable-e2e-root-password
    tmpfs: ["/var/lib/mysql:size=1g"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --host=127.0.0.1 --user=$$MYSQL_USER --database=$$MYSQL_DATABASE --silent --execute='SELECT 1'"]
      start_period: 30s
      interval: 3s
      timeout: 3s
      retries: 50
  redis:
    image: redis:8.2-alpine@sha256:5517128c78ca95f28f7dc6a90e2f808f35f01a4a01c2c20e514571b4d9706275
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    <<: *php
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080", "--no-reload"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/api/v1/health') === false ? 1 : 0);"]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    <<: *php
    command: ["php", "artisan", "queue:work", "redis", "--queue=imports,default", "--sleep=1", "--tries=3", "--timeout=60"]
    stop_grace_period: 70s
  outbox-relay:
    <<: *php
    command: ["php", "artisan", "outbox:relay", "--max-time=3600"]
    stop_grace_period: 70s
  # Intentionally no balance-projector: GET /balances must recalculate staled accounts.
  frontend:
    image: finance-ledger-e2e:local
    build:
      context: .
      dockerfile: docker/e2e/Dockerfile
    environment:
      VITE_API_BASE_URL: http://api:8080/api/v1
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
  browser:
    image: finance-ledger-e2e:local
    environment:
      CYPRESS_BASE_URL: http://frontend:5173
      CYPRESS_SCREENSHOTS_FOLDER: /artifacts/screenshots
      LEDGER_E2E_UID: ${LEDGER_E2E_UID:-1000}
      LEDGER_E2E_GID: ${LEDGER_E2E_GID:-1000}
    volumes:
      - ./frontend/artifacts:/artifacts
    shm_size: 1gb
    command: ["sh", "-c", "npm run test:e2e; result=$$?; chown -R $$LEDGER_E2E_UID:$$LEDGER_E2E_GID /artifacts; exit $$result"]
    init: true

volumes:
  e2e-storage:
  e2e-uploads:
