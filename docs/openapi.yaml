openapi: 3.1.0
info:
  title: Finance Ledger API
  version: 0.9.0
  description: >-
    Endpoints operacionais, autenticação, saldos, importação, dashboard e extratos até a etapa 09.
    JWT de 900 segundos, sem refresh; logout revoga somente o token apresentado.
    O worker prepara o CSV e processa chunks de até 500 registros com checkpoints idempotentes.
servers:
  - url: http://localhost:8080/api/v1
    description: Desenvolvimento local
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Aplicação HTTP inicializada
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: {type: string, const: ok}
                  service: {type: string, const: finance-ledger-api}
  /auth/login:
    post:
      operationId: login
      security: []
      description: >-
        Até 5 tentativas por e-mail/IP e 30 por IP a cada minuto, incluindo sucessos.
        E-mail é normalizado; espaços da senha são preservados.
        Respostas usam Cache-Control no-store e não criam cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 254}
                password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 1024
                  description: Até 1024 bytes UTF-8; bytes nulos não são permitidos.
      responses:
        '200':
          description: Credenciais válidas
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [access_token, token_type, expires_in, user]
                    properties:
                      access_token: {type: string}
                      token_type: {type: string, const: Bearer}
                      expires_in: {type: integer, const: 900}
                      user: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422':
          description: Campos inválidos
          content:
            application/json:
              schema:
                type: object
                required: [message, errors]
                properties:
                  message: {type: string}
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: {type: string}
        '429':
          description: Limite de tentativas excedido
          headers:
            Retry-After:
              description: Segundos até poder tentar novamente
              schema: {type: integer, minimum: 0}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {message: 'Too many login attempts. Please try again later.', code: rate_limited}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/me:
    get:
      operationId: currentUser
      security: [{bearerAuth: []}]
      description: Identidade atual do titular do JWT, consultada no MySQL.
      responses:
        '200':
          description: Perfil público
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/logout:
    post:
      operationId: logout
      security: [{bearerAuth: []}]
      description: >-
        Confirma somente depois de persistir a revogação no MySQL.
        Outros tokens permanecem válidos. Repetir com o token revogado retorna 401.
        Não aceita um token alvo no corpo.
      responses:
        '200':
          description: Token autenticado revogado
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revoked]
                    properties:
                      revoked: {type: boolean, const: true}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /balances:
    get:
      operationId: listAccountBalances
      security: [{bearerAuth: []}]
      description: >-
        Somente contas financeiras do titular, inclusive inativas, por ID interno crescente.
        Recalcula cada projeção pendente antes da resposta. Valores são centavos BRL em strings.
        Cada conta representa um estado consistente observado durante a requisição; a página
        não promete snapshot simultâneo entre contas. Falha de recálculo retorna 503 sem dados parciais.
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 9223372036854775807, default: 1}
          description: Inteiro decimal; offsets fora da faixa assinada de 64 bits retornam 422.
        - name: per_page
          in: query
          schema: {type: integer, minimum: 1, maximum: 10, default: 10}
        - name: account_number
          in: query
          schema: {type: string, pattern: '^[1-9][0-9]*$', maxLength: 19, example: '682'}
          description: Número externo positivo até 9223372036854775807; não é o ID interno.
      responses:
        '200':
          description: Página de saldos atuais; página além da última ou filtro sem resultado retorna data vazio.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    maxItems: 10
                    items: {$ref: '#/components/schemas/AccountBalance'}
                  meta: {$ref: '#/components/schemas/PageMeta'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/InvalidQuery'}
        '503': {$ref: '#/components/responses/BalanceUnavailable'}
  /accounts/{accountNumber}/balance:
    get:
      operationId: getAccountBalance
      security: [{bearerAuth: []}]
      description: >-
        Saldo de uma conta financeira do titular, resolvida pelo número externo, com recálculo
        obrigatório se pendente. Conta alheia e inexistente têm a mesma resposta 404.
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]*$', maxLength: 19, example: '682'}
      responses:
        '200':
          description: Saldo consistente da conta
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AccountBalance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: Conta não encontrada para o titular
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {message: 'Account not found.', code: account_not_found}
        '503': {$ref: '#/components/responses/BalanceUnavailable'}
  /imports:
    post:
      operationId: uploadCsvImport
      security: [{bearerAuth: []}]
      description: >-
        Exatamente um campo multipart file, sem outros campos ou arquivos.
        CSV não vazio, nome com extensão .csv (case insensitive), até 255 bytes UTF-8
        depois de remover componentes de diretório. Limite exato de 100000000 bytes por
        arquivo; envelope multipart de até 110000000 bytes. MIME do cliente não prova conteúdo.
        Persiste arquivo privado e importação com intenção de processamento na outbox,
        sem depender de publicação Redis na requisição. Validação de cabeçalho/integridade
        ocorre no worker. Reenvio cria outro acompanhamento; idempotência financeira é por linha.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV de 1 a 100000000 bytes; cabeçalho date,description,amount,type.
      responses:
        '202':
          description: Arquivo registrado; preparação e processamento são assíncronos.
          headers:
            Location:
              description: Caminho relativo da consulta de status; mesmo valor de data.status_url.
              schema: {type: string, example: '/api/v1/imports/15'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/UploadTooLarge'}
        '422': {$ref: '#/components/responses/InvalidImportUpload'}
        '503': {$ref: '#/components/responses/ImportUnavailable'}
    get:
      operationId: listImports
      security: [{bearerAuth: []}]
      description: >-
        Importações do usuário autenticado, ordenadas por ID decrescente.
        Padrão/máximo de 10 itens. Página além da última retorna data vazio.
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, maximum: 9223372036854775807, default: 1}
          description: Inteiro decimal; offsets fora da faixa assinada de 64 bits retornam 422.
        - name: per_page
          in: query
          schema: {type: integer, minimum: 1, maximum: 10, default: 10}
      responses:
        '200':
          description: Página de acompanhamentos do titular
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    maxItems: 10
                    items: {$ref: '#/components/schemas/Import'}
                  meta: {$ref: '#/components/schemas/PageMeta'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/InvalidQuery'}
        '503': {$ref: '#/components/responses/ImportUnavailable'}
  /imports/{importId}:
    get:
      operationId: getImport
      security: [{bearerAuth: []}]
      description: Importação alheia e inexistente têm a mesma resposta 404.
      parameters:
        - name: importId
          in: path
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]*$', maxLength: 19, example: '15'}
          description: ID positivo até 9223372036854775807.
      responses:
        '200':
          description: Acompanhamento atual da importação
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: Importação não encontrada para o titular
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {message: 'Import not found.', code: import_not_found}
        '503': {$ref: '#/components/responses/ImportUnavailable'}
  /dashboard:
    get:
      operationId: getDashboard
      security:
      - bearerAuth: []
      description: Totais globais do titular no snapshot identificado pela revisão. Não recebe filtros nem paginação.
        Soma somente a partida financeira de cada operação. Consulta a revisão no MySQL antes do cache Redis; falha
        de cache permite fallback SQL, e falha SQL retorna 503 sem cache antigo. Não altera projeções staled.
      responses:
        '200':
          description: Consulta concluída
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Dashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/FinancialReadUnavailable'
  /accounts:
    get:
      operationId: listAccounts
      security:
      - bearerAuth: []
      description: Contas financeiras do titular, inclusive inativas, por ID interno crescente. Não inclui saldos
        nem contrapartidas técnicas. Um filtro sem conta autorizada retorna data vazio.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
          default: 1
        description: Inteiro decimal; offsets fora da faixa assinada de 64 bits retornam 422.
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 10
      - name: account_number
        in: query
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 19
          example: '682'
        description: Número externo positivo até 9223372036854775807; não é o ID interno.
      responses:
        '200':
          description: Consulta concluída
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 10
                    items:
                      $ref: '#/components/schemas/Account'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/BalanceUnavailable'
        '422':
          $ref: '#/components/responses/InvalidQuery'
  /transactions:
    get:
      operationId: listTransactions
      security:
      - bearerAuth: []
      description: Operações do titular, por data financeira/ID decrescentes. Count e itens compartilham snapshot.
        Páginas diferentes podem deslocar-se durante importações concorrentes. Sem expansão de partidas ou cache Redis.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
          default: 1
        description: Inteiro decimal; offsets fora da faixa assinada de 64 bits retornam 422.
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 10
      - name: account_number
        in: query
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 19
          example: '682'
        description: Número externo positivo até 9223372036854775807; não é o ID interno.
      - name: date_from
        in: query
        schema:
          type: string
          format: date
          pattern: ^[1-9][0-9]{3}-[0-9]{2}-[0-9]{2}$
        description: Data inicial inclusiva.
      - name: date_to
        in: query
        schema:
          type: string
          format: date
          pattern: ^[1-9][0-9]{3}-[0-9]{2}-[0-9]{2}$
        description: Data final inclusiva; não pode ser anterior a date_from.
      - name: type
        in: query
        schema:
          type: string
          enum:
          - income
          - expense
      responses:
        '200':
          description: Consulta concluída
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 10
                    items:
                      $ref: '#/components/schemas/Transaction'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/FinancialReadUnavailable'
        '422':
          $ref: '#/components/responses/InvalidQuery'
        '404':
          description: 'Conta informada inexistente ou não autorizada: account_not_found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /accounts/{accountNumber}/transactions:
    get:
      operationId: listAccountTransactions
      security:
      - bearerAuth: []
      description: Extrato da conta financeira do titular, inclusive inativa. O número externo da rota prevalece sobre
        account_number na query. Ordenação e consistência seguem /transactions.
      parameters:
      - name: accountNumber
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 19
        description: Identificador decimal positivo até 9223372036854775807.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
          default: 1
        description: Inteiro decimal; offsets fora da faixa assinada de 64 bits retornam 422.
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 10
      - name: date_from
        in: query
        schema:
          type: string
          format: date
          pattern: ^[1-9][0-9]{3}-[0-9]{2}-[0-9]{2}$
        description: Data inicial inclusiva.
      - name: date_to
        in: query
        schema:
          type: string
          format: date
          pattern: ^[1-9][0-9]{3}-[0-9]{2}-[0-9]{2}$
        description: Data final inclusiva; não pode ser anterior a date_from.
      - name: type
        in: query
        schema:
          type: string
          enum:
          - income
          - expense
      responses:
        '200':
          description: Consulta concluída
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 10
                    items:
                      $ref: '#/components/schemas/Transaction'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/FinancialReadUnavailable'
        '422':
          $ref: '#/components/responses/InvalidQuery'
        '404':
          description: 'Conta inexistente ou não autorizada: account_not_found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{importId}/rows:
    get:
      operationId: listImportRows
      security:
      - bearerAuth: []
      description: Resultados confirmados por número lógico crescente. Cabeçalho é o registro 1. Titularidade, count
        e itens são consultados no mesmo snapshot. Uma importação própria ainda sem resultados retorna página vazia.
      parameters:
      - name: importId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 19
        description: Identificador decimal positivo até 9223372036854775807.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
          default: 1
        description: Inteiro decimal; offsets fora da faixa assinada de 64 bits retornam 422.
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 10
      - name: status
        in: query
        schema:
          type: string
          enum:
          - inserted
          - duplicate
          - rejected
      responses:
        '200':
          description: Consulta concluída
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 10
                    items:
                      $ref: '#/components/schemas/ImportRow'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/FinancialReadUnavailable'
        '422':
          $ref: '#/components/responses/InvalidQuery'
        '404':
          description: 'Importação inexistente ou não autorizada: import_not_found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{importId}/errors:
    get:
      operationId: listImportErrors
      security:
      - bearerAuth: []
      description: Somente registros rejeitados, por número lógico crescente. Query status não pode ampliar o resultado.
        Falhas estruturais sem checkpoint permanecem no acompanhamento, sem linhas fictícias.
      parameters:
      - name: importId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
          maxLength: 19
        description: Identificador decimal positivo até 9223372036854775807.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 9223372036854775807
          default: 1
        description: Inteiro decimal; offsets fora da faixa assinada de 64 bits retornam 422.
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 10
      responses:
        '200':
          description: Consulta concluída
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 10
                    items:
                      $ref: '#/components/schemas/ImportRow'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/FinancialReadUnavailable'
        '422':
          $ref: '#/components/responses/InvalidQuery'
        '404':
          description: 'Importação inexistente ou não autorizada: import_not_found.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Header Authorization com JWT HS256 emitido pelo login.
  headers:
    NoStore:
      schema: {type: string, example: 'no-store, private'}
  schemas:
    Dashboard:
      type: object
      required:
      - currency
      - income_minor
      - expense_minor
      - balance_minor
      - transaction_count
      - financial_revision
      properties:
        currency:
          type: string
          const: BRL
        income_minor:
          $ref: '#/components/schemas/UnsignedInteger'
        expense_minor:
          $ref: '#/components/schemas/UnsignedInteger'
        balance_minor:
          $ref: '#/components/schemas/DecimalInteger'
        transaction_count:
          $ref: '#/components/schemas/UnsignedInteger'
        financial_revision:
          $ref: '#/components/schemas/UnsignedInteger'
    Account:
      type: object
      required:
      - id
      - account_number
      - currency
      - active
      properties:
        id:
          $ref: '#/components/schemas/UnsignedInteger'
        account_number:
          $ref: '#/components/schemas/UnsignedInteger'
        currency:
          type: string
          const: BRL
        active:
          type: boolean
    Transaction:
      type: object
      required:
      - id
      - account_number
      - transaction_date
      - description
      - type
      - amount_minor
      - currency
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/UnsignedInteger'
        account_number:
          $ref: '#/components/schemas/UnsignedInteger'
        transaction_date:
          type: string
          format: date
        description:
          type: string
        type:
          type: string
          enum:
          - income
          - expense
        amount_minor:
          $ref: '#/components/schemas/UnsignedInteger'
        currency:
          type: string
          const: BRL
        created_at:
          type: string
          format: date-time
    ImportRow:
      type: object
      required:
      - id
      - source_record_number
      - status
      - source_row_hash
      - journal_entry_id
      - error_code
      - error_message
      properties:
        id:
          $ref: '#/components/schemas/UnsignedInteger'
        source_record_number:
          $ref: '#/components/schemas/UnsignedInteger'
        status:
          type: string
          enum:
          - inserted
          - duplicate
          - rejected
        source_row_hash:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{64}$
        journal_entry_id:
          type:
          - string
          - 'null'
          pattern: ^[1-9][0-9]*$
        error_code:
          type:
          - string
          - 'null'
        error_message:
          type:
          - string
          - 'null'
          description: Mensagem genérica de rejeição; não contém SQL nem detalhes internos.
    DecimalInteger:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)$'
      description: Inteiro decimal exato; para dinheiro, centavos de BRL.
    UnsignedInteger:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
    ImportResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/Import'}
    Import:
      type: object
      additionalProperties: false
      required: [id, original_name, file_size_bytes, status, processed_rows, inserted_rows, duplicate_rows, rejected_rows, created_at, prepared_at, started_at, finished_at, error_code, status_url]
      properties:
        id: {type: string, pattern: '^[1-9][0-9]*$', example: '15'}
        original_name:
          type: string
          maxLength: 255
          description: Nome recebido, sem componentes de diretório, limitado a 255 bytes UTF-8.
          example: financial_transactions.csv
        file_size_bytes: {type: integer, minimum: 1, maximum: 100000000, example: 788178}
        status:
          type: string
          enum: [pending, processing, completed, completed_with_errors, failed]
          description: >-
            pending aguarda preparação/primeiro chunk; processing indica processamento iniciado,
            incluindo espera por retentativa; completed termina sem rejeições;
            completed_with_errors termina com registros rejeitados; failed encerra por falha
            estrutural/integridade ou tentativas esgotadas. Lotes anteriores continuam confirmados.
        processed_rows: {$ref: '#/components/schemas/UnsignedInteger'}
        inserted_rows: {$ref: '#/components/schemas/UnsignedInteger'}
        duplicate_rows: {$ref: '#/components/schemas/UnsignedInteger'}
        rejected_rows: {$ref: '#/components/schemas/UnsignedInteger'}
        created_at:
          type: string
          format: date-time
          example: '2026-09-23T12:00:00.000000Z'
        prepared_at:
          type: [string, 'null']
          format: date-time
          description: UTC; preenchido depois da verificação de integridade/cabeçalho e commit do checkpoint inicial.
        started_at:
          type: [string, 'null']
          format: date-time
          description: UTC da primeira reserva de um chunk; não significa que esse lote já foi confirmado.
        finished_at:
          type: [string, 'null']
          format: date-time
        error_code:
          type: [string, 'null']
          description: Código seguro da última falha; pode aparecer durante processing enquanto aguarda nova tentativa.
          examples: [null, invalid_csv_header, source_file_missing, source_file_changed, malformed_csv, csv_record_too_large, import_chunk_unavailable, import_chunk_attempts_exhausted]
        status_url:
          type: string
          pattern: '^/api/v1/imports/[1-9][0-9]*$'
          example: /api/v1/imports/15
    AccountBalance:
      type: object
      additionalProperties: false
      required: [account_id, account_number, active, currency, debit_total_minor, credit_total_minor, balance_minor, ledger_version, calculated_version, calculated_at]
      properties:
        account_id: {type: string, pattern: '^[1-9][0-9]*$', example: '42'}
        account_number: {type: string, pattern: '^[1-9][0-9]*$', example: '682'}
        active: {type: boolean}
        currency: {type: string, const: BRL}
        debit_total_minor: {$ref: '#/components/schemas/UnsignedInteger'}
        credit_total_minor: {$ref: '#/components/schemas/UnsignedInteger'}
        balance_minor: {$ref: '#/components/schemas/DecimalInteger'}
        ledger_version: {$ref: '#/components/schemas/UnsignedInteger'}
        calculated_version: {$ref: '#/components/schemas/UnsignedInteger'}
        calculated_at:
          type: [string, 'null']
          format: date-time
          description: Instante UTC do cálculo, nulo somente se a projeção legada não tiver timestamp.
          example: '2026-09-23T12:00:00.000000Z'
    PageMeta:
      type: object
      required: [current_page, per_page, total, last_page, has_next_page]
      properties:
        current_page: {type: integer, minimum: 1}
        per_page: {type: integer, minimum: 1, maximum: 10}
        total: {type: integer, minimum: 0}
        last_page: {type: integer, minimum: 1}
        has_next_page: {type: boolean}
    User:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id: {type: string, pattern: '^[1-9][0-9]*$', example: '1'}
        name: {type: string, example: Demo Ledger}
        email: {type: string, format: email, example: demo@example.test}
    Error:
      type: object
      required: [message, code]
      properties:
        message: {type: string}
        code:
          type: string
          enum: [invalid_credentials, unauthenticated, rate_limited, authentication_unavailable, account_not_found, balance_unavailable, import_not_found, import_unavailable, upload_too_large, multipart_required, invalid_multipart, one_csv_required, incomplete_upload, empty_csv_file, invalid_csv_file]
  responses:
    FinancialReadUnavailable:
      description: Falha de leitura financeira ou overflow. Não retorna dados parciais, antigos ou zero substituto.
      headers:
        Retry-After:
          schema:
            type: integer
            const: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Financial data is temporarily unavailable.
            code: financial_read_unavailable
    UploadTooLarge:
      description: Arquivo acima de 100000000 bytes ou corpo multipart acima de 110000000 bytes.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: 'The CSV must not exceed 100000000 bytes.', code: upload_too_large}
    InvalidImportUpload:
      description: >-
        CSV vazio, nome inválido, upload incompleto, multipart inválido ou violação
        do contrato de exatamente um campo file. O código distingue o motivo.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            file:
              value: {message: 'The uploaded CSV is invalid.', code: invalid_csv_file}
            multipart:
              value: {message: 'The uploaded CSV is invalid.', code: invalid_multipart}
    ImportUnavailable:
      description: Autenticação, persistência, armazenamento ou configuração de upload temporariamente indisponível.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: 'Imports are temporarily unavailable.', code: import_unavailable}
    InvalidQuery:
      description: Paginação ou filtro inválido
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema:
            type: object
            required: [message, errors]
            properties:
              message: {type: string}
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: {type: string}
    BalanceUnavailable:
      description: Autenticação ou consulta/recálculo temporariamente indisponível; nenhum saldo é retornado.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Retry-After:
          description: Presente para balance_unavailable, sugestão de nova tentativa em segundos.
          schema: {type: string, example: '1'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: 'Account balances are temporarily unavailable.', code: balance_unavailable}
    Unauthorized:
      description: Credenciais inválidas ou token ausente, inválido, expirado ou revogado
      headers:
        WWW-Authenticate:
          schema: {type: string, const: Bearer}
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            credentials:
              value: {message: 'Invalid email or password.', code: invalid_credentials}
            token:
              value: {message: 'Unauthenticated.', code: unauthenticated}
    Unavailable:
      description: Configuração de assinatura ou persistência de autenticação indisponível
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: 'Authentication is temporarily unavailable.', code: authentication_unavailable}
