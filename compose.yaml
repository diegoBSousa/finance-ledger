x-php: &php
  image: finance-ledger-php:development
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  working_dir: /var/www/html
  environment: &php-environment
    LOCAL_UID: ${LOCAL_UID:-1000}
    LOCAL_GID: ${LOCAL_GID:-1000}
    APP_NAME: ${APP_NAME:-Finance Ledger}
    APP_ENV: ${APP_ENV:-local}
    APP_KEY: ${APP_KEY}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_URL: ${APP_URL:-http://localhost:8080}
    APP_LOCALE: ${APP_LOCALE:-pt_BR}
    APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
    LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
    LOG_LEVEL: ${LOG_LEVEL:-debug}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    REDIS_CLIENT: phpredis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_DB: 0
    REDIS_CACHE_DB: 1
    REDIS_PREFIX: ${REDIS_PREFIX:-finance_ledger:}
    CACHE_STORE: redis
    CACHE_PREFIX: ${CACHE_PREFIX:-finance_ledger_cache:}
    QUEUE_CONNECTION: redis
    REDIS_QUEUE_RETRY_AFTER: 90
    SESSION_DRIVER: array
    HASH_DRIVER: argon2id
    FILESYSTEM_DISK: local
    MAIL_MAILER: log
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@example.test}
    DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
    JWT_SECRET: ${JWT_SECRET:-}
    JWT_ISSUER: ${JWT_ISSUER:-finance-ledger-api}
    JWT_AUDIENCE: ${JWT_AUDIENCE:-finance-ledger-spa}
  volumes:
    - ./backend:/var/www/html
    - uploads:/var/www/html/storage/app/private/uploads
  init: true

services:
  app:
    <<: *php
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports:
      - "127.0.0.1:${API_PORT:-8080}:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  mysql:
    image: mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
    # Permit trigger migrations with the database-scoped application user.
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --host=127.0.0.1 --user=$$MYSQL_USER --database=$$MYSQL_DATABASE --silent --execute='SELECT 1'"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-test:
    profiles: [test]
    image: mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: finance_ledger_test
      MYSQL_USER: ledger_test
      MYSQL_PASSWORD: disposable-test-password
      MYSQL_ROOT_PASSWORD: disposable-test-root-password
    tmpfs:
      - /var/lib/mysql:size=1g
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --host=127.0.0.1 --user=$$MYSQL_USER --database=$$MYSQL_DATABASE --silent --execute='SELECT 1'"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 30

  test-runner:
    <<: *php
    profiles: [test]
    environment:
      <<: *php-environment
      APP_ENV: testing
      DB_HOST: mysql-test
      DB_DATABASE: finance_ledger_test
      DB_USERNAME: ledger_test
      DB_PASSWORD: disposable-test-password
      MYSQL_TEST_RESET: 1
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql-test:
        condition: service_healthy
    command: ["composer", "test:integration"]

  redis:
    image: redis:8.2-alpine@sha256:5517128c78ca95f28f7dc6a90e2f808f35f01a4a01c2c20e514571b4d9706275
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    <<: *php
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--sleep=1", "--tries=3", "--timeout=60", "--max-time=3600"]
    restart: unless-stopped
    stop_grace_period: 70s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      npm_config_cache: /tmp/npm-cache
    volumes:
      - ./frontend:/app
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mysql-data:
  redis-data:
  uploads:
